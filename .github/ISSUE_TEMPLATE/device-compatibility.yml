name: Device compatibility test
description: Submit a sanitized test report for another Govee light model
title: "[Device test] "
labels: ["device compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve model support. Generate the report from **Devices → Create compatibility report**. Review the text file before attaching it; it is designed to omit secrets and device/account identifiers.
  - type: input
    id: model
    attributes:
      label: Govee model / SKU
      placeholder: H6046
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Segmented mapping worked as described
        - Segmented mapping differed
        - Segmented commands were not accepted
        - Read-only report only
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: What did the light do?
      description: Describe visible results by physical bar/strip/section. Do not paste an API key, device ID, IP/MAC address, or raw API response.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Sanitized compatibility report
      description: After reviewing it, drag the .txt report created by the plugin into this box to attach it.
      placeholder: Drag the reviewed .txt report here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed the attachment and it contains no API key or device/account/network identifier.
          required: true
